org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP registers its generated sources through the `kotlin.sourceSets` DSL,
# which AGP 9's built-in Kotlin support otherwise rejects. This flag is the
# escape hatch AGP itself points at in that error. Remove it once KSP
# registers sources through `android.sourceSets`.
android.disallowKotlinSourceSets=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
